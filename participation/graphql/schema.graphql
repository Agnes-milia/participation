#import Mutations/*.graphql
type Query {
    # User base queries
    users: [User!]! @all
    user(id: ID! @eq): User @find
    # Example use of like operator
    userLike(name: String! @like): [User!]! @all
    # Example use of pagination, all data, but paginated
    userPaginate: [User!]! @paginate
    event(id: ID! @eq): Event @find
    # Example use of like operator
    eventWhere(id: ID! @where(operator: "<=")): [Event!]! @all
    # all registrations, excluding soft deleted ones
    registrations: [Registration!]! @all
    # registration belongsto a user
    registration(id: ID! @eq): Registration @find
    # registration hasMany registrations
    events: [Event!]! @all
}

type User {
    "Unique primary key."
    id: ID!
    "Non-unique name."
    name: String!
    "Unique email address."
    email: String!
    events: [Event!]! @belongsToMany
    
}
type Event{
    # fields
    id: ID!
    title: String!
    early_bird_price: Int!
    early_bird_until: DateTime!
    price_multiplier: Float!
    # registrations belongsto a user
    registrations: [Registration!]! @hasMany
}

type Registration{
    id: ID!
    user_id: ID!
    event_id: ID!
    datetime: DateTime!
    user: User! @belongsTo
    event: Event! @belongsTo
    price: Int! @method(name: "priceCount")
}


